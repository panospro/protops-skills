# Keys install.sh merges into ~/.codex/config.toml.
# Everything else in that file — [projects.*], [mcp_servers.*], auth — is left untouched.

model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[agents]
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 3
